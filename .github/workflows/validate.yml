name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate Compose files
        shell: pwsh
        run: ./scripts/Test-Compose.ps1
      - name: Enforce private project exclusion
        shell: bash
        run: |
          if grep -Ril --exclude='.inventoryignore' --exclude='Import-Compose.ps1' --exclude='Export-Dashboard.ps1' --exclude='Export-Inventory.ps1' 'stash' apps docs; then
            echo 'Excluded project appeared in a public artifact.'
            exit 1
          fi

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
