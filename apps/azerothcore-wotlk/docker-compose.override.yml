services:
  ac-volfix:
    container_name: ac-volfix
    image: alpine:latest
    command: chown -R 1000:1000 /fix-etc /fix-logs
    volumes:
      - ${DOCKER_VOL_ETC:-./env/dist/etc}:/fix-etc
      - ${DOCKER_VOL_LOGS:-./env/dist/logs}:/fix-logs
    restart: "no"

  ac-db-import:
    depends_on:
      ac-volfix:
        condition: service_completed_successfully
    restart: "no"

  ac-authserver:
    depends_on:
      ac-database:
        condition: service_healthy
    restart: unless-stopped

  ac-worldserver:
    depends_on:
      ac-database:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      AC_UPDATES_ENABLE_DATABASES: 0
    volumes:
      - ./modules:/azerothcore/modules:rw
    restart: unless-stopped
    cpus: 4.0
    mem_limit: 8g
    stop_grace_period: 90s

  ac-database:
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    command:
      - --innodb-buffer-pool-size=4G
      - --innodb-buffer-pool-instances=8
      - --innodb-flush-log-at-trx-commit=2
      - --max-connections=300
      - --thread-cache-size=32
      - --sync-binlog=0
    cpus: 4.0
    mem_limit: 8g
    stop_grace_period: 90s

  ac-llm-chatter-bridge:
    container_name: ac-llm-chatter-bridge
    image: python:3.11-slim
    networks:
      - ac-network
    working_dir: /app
    environment:
      - PYTHONUNBUFFERED=1
    command: >
      bash -c "
        pip install --quiet -r /app/requirements.txt &&
        python llm_chatter_bridge.py --config /config/mod_llm_chatter.conf
      "
    volumes:
      - ./modules/mod-llm-chatter/tools:/app:ro
      - ../wotlk/etc/modules:/config:ro
    restart: unless-stopped
    depends_on:
      ac-database:
        condition: service_healthy
