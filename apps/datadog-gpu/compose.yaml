services:
  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:3.1.7-3.1.4-ubuntu20.04
    container_name: dcgm-exporter
    runtime: nvidia
    privileged: true
    pid: host
    environment:
      - DCGM_EXPORTER_INTERVAL=5000
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    volumes:
      - /proc:/proc
      - ./default-counters.csv:/etc/dcgm-exporter/default-counters.csv
    ports:
      - "9400:9400"
    labels:
      com.datadoghq.ad.check_names: '["dcgm"]'
      com.datadoghq.ad.init_configs: '[{}]'
      com.datadoghq.ad.instances: '[{"openmetrics_endpoint":"http://%%host%%:9400/metrics"}]'
    restart: unless-stopped
