services:
  frigate:
    container_name: frigate
    # Use the NVIDIA-enabled image for ONNX inference on the RTX 3050.
    # image: ghcr.io/blakeblackshear/frigate:stable-tensorrt
    image: ghcr.io/blakeblackshear/frigate:0.16.3-tensorrt
    privileged: true
    restart: always
    shm_size: 512MB
    gpus: all

    environment:
      - FRIGATE_RTSP_PASSWORD=${FRIGATE_RTSP_PASSWORD}
      - TZ=America/New_York
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    ports:
      - "8971:8971"
      - "5112:5000"
      - "8554:8554"   # RTSP
      - "8555:8555/tcp" # WebRTC TCP
      - "8555:8555/udp" # WebRTC UDP

    volumes:
      - ./config:/config
      - D:\security:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 7000000000
