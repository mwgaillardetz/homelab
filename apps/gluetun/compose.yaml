  #     - "9193:9191"      # dispatcharr3
  #
  #   restart: always
  #   networks:
  #     - gluetun_net

  # ---- Apps sharing gluetun2's network namespace ------------------
  dispatcharr2:
    image: ghcr.io/dispatcharr/dispatcharr:latest
    container_name: dispatcharr2
    restart: always
    network_mode: "service:gluetun2"
    depends_on:
      gluetun2:
        condition: service_healthy
    volumes:
      - 'C:\docker-projects\dispatcharr\two\dispatcharr_data:/data'
      - 'C:\docker-projects\dispatcharr\logos:/data/logos'
      - 'C:\docker-projects\dispatcharr\scripts:/scripts'
    environment:
      - DISPATCHARR_ENV=aio
      - TZ=America/New_York
      - REDIS_HOST=localhost
      - CELERY_BROKER_URL=redis://localhost:6379/0
      - DISPATCHARR_LOG_LEVEL=info
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    labels:
      com.datadoghq.ad.logs: '[{"source": "dispatcharr", "service": "dispatcharr"}]'
      com.datadoghq.ad.check_names: '["http_check"]'
      com.datadoghq.ad.init_configs: '[{}]'
      com.datadoghq.ad.instances: '[{"name": "dispatcharr2_health", "url": "http://%%host%%:9192", "timeout": 10, "tags": ["service:dispatcharr", "instance:dispatcharr2"]}]'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9191"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # dispatcharr3:
