services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=mullvad
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=10.65.1.8/32
      - TZ=America/New_York
      - SERVER_COUNTRIES=USA
      - SERVER_CITIES="Boston, MA,Secaucus, NJ,New York NY,Washington DC"
      - HTTPPROXY=on
      - HTTPPROXY_LISTENING_ADDRESS=:8888
      - FIREWALL_OUTBOUND_SUBNETS=192.168.1.0/24
    volumes:
      - ./gluetun:/gluetun
    ports:
      - "8888:8888/tcp"  # HTTP proxy
      - "8388:8388/tcp"  # Shadowsocks
      - "8388:8388/udp"  # Shadowsocks
      - "5021:5021"      # qBittorrent Web UI (exposed via Gluetun)
      - "5800:5800"      # Firefox
      # - "9192:9191"      # dispatcharr2
      - "6080:80"        # wordpress
      - "5055:5055"      # Overseerr
      - "6596:6595"      # Deemix
      - "7576:7575"      # Homarr
      - "9925:9000"      # Mealie
      - "5030:5030"      # slskd
      - "5031:5031"      # slskd
      - "5032:50300"     # slskd

    restart: always
    networks:
      - gluetun_net

  gluetun2:
    image: qmcgaw/gluetun:latest
    container_name: gluetun2
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=mullvad
      - VPN_TYPE=wireguard
      - SERVER_COUNTRIES=USA
      - SERVER_CITIES="Boston, MA,Secaucus, NJ,New York NY,Washington DC"
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=10.73.157.51/32
      - TZ=America/New_York
      - HTTPPROXY=on
      - HTTPPROXY_LISTENING_ADDRESS=:8888
      - FIREWALL_OUTBOUND_SUBNETS=192.168.1.0/24
    volumes:
      - ./gluetun2:/gluetun
    ports:
      - "8889:8888/tcp"  # HTTP proxy
      - "8389:8388/tcp"  # Shadowsocks
      - "8389:8388/udp"  # Shadowsocks
      - "9192:9191"      # dispatcharr2

    restart: always
    networks:
      - gluetun_net

