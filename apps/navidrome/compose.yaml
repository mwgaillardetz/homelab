services:
  navidrome:
    image: deluan/navidrome:latest
    user: 1000:1000 # should be owner of volumes
    environment:
      - ND_PLUGINS_ENABLED=true
    ports:
      - "4533:4533"
    restart: unless-stopped
    volumes:
      - "./data:/data"
      - "/m/Music:/music:ro"
networks:
  default:
    external: true
    name: music-network
